name: Docs and benchmarks

# Renders every tests/samples diagram with mermaid-cli and each mermaidx backend,
# builds the Docusaurus site with the results, and publishes it to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "docs/**"
      - "benchmarks/**"
      - "tests/samples/**"
      - "architecture.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "benchmarks/**"
      - "architecture.md"
      - "CHANGELOG.md"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mermaidx with every backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Allow headless Chrome on the runner
        run: |
          echo '{"args": ["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"

      - name: Run the benchmark
        run: |
          python benchmarks/run.py \
            --out benchmarks-out \
            --puppeteer-config "$RUNNER_TEMP/puppeteer.json"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmarks-out
          if-no-files-found: error

  build:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: benchmarks
          path: docs/static/benchmarks

      - name: Build the site
        working-directory: docs
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
