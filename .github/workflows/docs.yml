name: Docs and benchmarks

# Everything runs through the Makefile, and `make all` installs what it needs, so the same
# command works locally. It renders tests/samples with mermaid-cli and every mermaidx backend,
# renders the landing-page examples and builds the Docusaurus site; this workflow then
# publishes the result to GitHub Pages. See docs/README.md.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "docs/**"
      - "benchmarks/**"
      - "tests/samples/**"
      - "architecture.md"
      - "CHANGELOG.md"
      - "Makefile"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "benchmarks/**"
      - "architecture.md"
      - "CHANGELOG.md"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Benchmark and build the site
        run: make all
        env:
          NO_SANDBOX: "1"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
